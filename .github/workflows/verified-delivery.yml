name: LingoGrab verified delivery
on:
  push:
    branches: [main, 'qa/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingograb-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_PATH: ${{ github.workspace }}/ci/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      - run: node ci/check-routing.mjs
      - run: node ci/node_modules/playwright/cli.js install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: node ci/check-network-isolation.mjs
      - run: node eval/run-product-experience.mjs
      - run: node eval/run-learning-evidence.mjs
      - run: node eval/run-review-insights.mjs
      - run: node ci/prepare-delivery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingograb-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            eval/reports/lingograb-product-optimization-evaluation.*
            eval/reports/lingograb-learning-evidence-evaluation.*
            eval/reports/lingograb-review-insights-evaluation.*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: lingograb-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: error
          retention-days: 14
